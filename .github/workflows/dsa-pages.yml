# Publishes DSA/ as a website on GitHub Pages.
# Every lab gets a link at https://<user>.github.io/<repo>/DSA/<path-in-repo>
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

name: Publish DSA labs

on:
  push:
    branches: [main]
    # Only rebuild when the labs or this workflow change, not on every push to main.
    paths:
      - "DSA/**"
      - ".github/workflows/dsa-pages.yml"
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DSA/tools/requirements.txt

      - name: Build site
        run: |
          pip install -r DSA/tools/requirements.txt
          python DSA/tools/build_site.py --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}DSA/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
